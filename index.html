<!--
================================================================================
  このアプリについて
  埼玉県庁の新星を育てる会 — 設計思想と共同編集の進め方
================================================================================

【アプリの目的】
  「埼玉県庁の新星を育てる会」のポータルページ。
  会のメンバーが各アプリにアクセスするための入口として機能する。
  index_dojo.html（大石道場）と同じ作り・同じ雰囲気で、この会専用にしたもの。

【利用環境】
  - スマホ利用を最優先とする（モバイルファースト）
  - GitHub Pages でホスティング（単一 index-shinsei.html で完結）
  - 各アプリへのリンクを管理する

【技術構成】
  - 純粋なHTML/CSS（JavaScriptなし）。リンクだけを並べる
  - 外部ライブラリなし・ビルド不要・1ファイル完結
  - シンプルさを最優先とする

【共同編集の進め方】
  このアプリは、ユーザーと生成AIが対話しながら少しずつ育てていくものです。
  以下は、その共同作業をうまく続けるための共通認識です。

  ・このアプリの文脈と歴史を理解した上で提案する
  ・変更の意図と影響範囲を共有しながら進める
  ・小さな積み重ねを大切にし、一度に大きく変えない
  ・既存の操作感や雰囲気はできるだけ引き継ぐ
  ・読みやすく・触りやすく・壊れにくい構成を選ぶ
  ・新しい技術より、長く使い続けられることを優先する
  ・アプリを追加・変更したら「収録アプリ」を合わせて更新する

【収録アプリ（現時点）】
  - 開催日程（yotei-shinsei.html）：碁会などの予定・実績と、参加表明
  - 新星の対局記録（shinsei.html）：対局日・手合い・結果・目数差の記録と履歴
  - 棋譜あるき（kifu.html）：仲間に観てほしい棋譜のURL共有・感想（山あるきと共通のデータ）
  - 囲碁 一局一得（goroku.html）：対局前に考え、対局後に学ぶアプリ（?group=shinsei で、しおりは
      この会だけで共有。山あるきとは別）
  - 囲碁読み物（dangi.html）：囲碁にまつわる読み物・考察

  メニューは、グループ見出し＋3列のタイル（アイコン＋短い名称）で並べる。説明文は置かない
  （縦スクロールを減らすため。山あるきのindex.htmlと同じ作り）。グループ構成：
    会の活動（開催日程・対局記録）／囲碁をみがく（棋譜あるき・一局一得・囲碁読み物）
  開催日程は一番上・先頭に置く。アプリを追加したら、いずれかのグループにタイルを足す。
  タイルの名称は6文字前後に収める。

  タイトル下の一言は「一局ずつ、いっしょに伸びていこう」。新星本人も読むため、
  「見守る」のような、見る側・見られる側が分かれる言い方は避けている。

【今後の改良候補】
  - 新星の成長の軌跡（月ごとの記録）ページの追加
  - 山あるきの合言葉とは別の、この会専用の合言葉の検討
================================================================================
-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>埼玉県庁の新星を育てる会</title>

  <style>
    :root { color-scheme: light; }
    html { background: #fcfaf2; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Hiragino Kaku Gothic ProN", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fcfaf2;
      color: #333;
    }

    .wrap {
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 16px 18px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 6px;
      font-size: 1.4rem;
      line-height: 1.4;
    }

    .sub {
      text-align: center;
      color: #777;
      margin-bottom: 18px;
      font-size: 0.92rem;
    }

    .group-title {
      font-size: 0.78rem;
      color: #7a5c3a;
      letter-spacing: 0.05em;
      border-left: 4px solid #b89752;
      padding-left: 8px;
      margin: 14px 0 6px;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 64px;
      padding: 6px 4px;
      text-decoration: none;
      background: #fff;
      border: 1px solid #e0dbcd;
      border-radius: 12px;
      color: inherit;
      transition: 0.2s;
    }

    .tile:active {
      transform: scale(0.96);
    }

    .tile-icon { font-size: 1.4rem; line-height: 1; }

    .tile-name {
      font-size: 0.8rem;
      font-weight: bold;
      color: #2c3e50;
      text-align: center;
      line-height: 1.3;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #999;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<div class="wrap">

  <h1>🌟 埼玉県庁の<br>新星を育てる会</h1>

  <div class="sub">
    一局ずつ、いっしょに伸びていこう
  </div>

  <div class="group-title">会の活動</div>
  <div class="tile-grid">
    <a class="tile" href="yotei-shinsei.html">
      <span class="tile-icon">📅</span>
      <span class="tile-name">開催日程</span>
    </a>
    <a class="tile" href="shinsei.html">
      <span class="tile-icon">⚫</span>
      <span class="tile-name">対局記録</span>
    </a>
  </div>

  <div class="group-title">囲碁をみがく</div>
  <div class="tile-grid">
    <a class="tile" href="kifu.html?v=3">
      <span class="tile-icon">👣</span>
      <span class="tile-name">棋譜あるき</span>
    </a>
    <a class="tile" href="goroku.html?group=shinsei">
      <span class="tile-icon">📖</span>
      <span class="tile-name">一局一得</span>
    </a>
    <a class="tile" href="dangi.html">
      <span class="tile-icon">📝</span>
      <span class="tile-name">囲碁読み物</span>
    </a>
  </div>

  <div class="footer">
    GitHub Pages + Firebase
  </div>

</div>

</body>
</html>
